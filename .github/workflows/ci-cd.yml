name: Frontend CI/CD Pipeline

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
  workflow_dispatch:
    inputs:
      deploy_to_server:
        description: 'Triển khai lên server sau khi build?'
        required: true
        default: true
        type: boolean
      build_config:
        description: 'Cấu hình build Angular'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - development
      run_lint:
        description: 'Chạy kiểm tra ESLint?'
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  # ----------------------------------------------------------------------------
  # JOB 1: Fast Code Quality & Lint Validation
  # ----------------------------------------------------------------------------
  validate:
    name: ⚡ Fast Validation (Lint & Check)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout frontend repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies (clean install with legacy peer deps)
        run: npm ci --legacy-peer-deps --prefer-offline

      - name: Run ESLint Check
        if: github.event.inputs.run_lint != 'false'
        run: npm run lint
        continue-on-error: true

  # ----------------------------------------------------------------------------
  # JOB 2: Build Angular Production/Development Bundle & Package Artifact
  # ----------------------------------------------------------------------------
  build:
    name: 📦 Angular Build & Package
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      short_sha: ${{ steps.vars.outputs.short_sha }}
      package_name: ${{ steps.vars.outputs.package_name }}
    steps:
      - name: Set short git SHA & Package Vars
        id: vars
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "package_name=frontend-dist-${SHORT_SHA}.tar.gz" >> $GITHUB_OUTPUT

      - name: Checkout frontend repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --prefer-offline

      - name: Build Angular Application
        env:
          APP_VERSION: ${{ steps.vars.outputs.short_sha }}
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: |
          BUILD_CFG="${{ github.event.inputs.build_config || 'production' }}"
          echo "▶ Đang build Angular với cấu hình: ${BUILD_CFG} (Version: ${APP_VERSION})"
          if [ "${BUILD_CFG}" = "development" ]; then
            npm run build:dev
          else
            npm run build:prod
          fi

      - name: Locate & Verify Build Output
        id: locate-dist
        run: |
          if [ -d "dist/frontend/browser" ]; then
            echo "DIST_DIR=dist/frontend/browser" >> $GITHUB_ENV
          elif [ -d "dist/frontend" ]; then
            echo "DIST_DIR=dist/frontend" >> $GITHUB_ENV
          else
            echo "❌ Không tìm thấy thư mục output build tại dist/!"
            exit 1
          fi

      - name: Package Dist to Archive (.tar.gz)
        run: |
          echo "▶ Nén thư mục ${DIST_DIR} thành ${{ steps.vars.outputs.package_name }}..."
          tar -czf "${{ steps.vars.outputs.package_name }}" -C "${DIST_DIR}" .
          ls -lh "${{ steps.vars.outputs.package_name }}"

      - name: Upload Build Artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-${{ steps.vars.outputs.short_sha }}
          path: ${{ steps.vars.outputs.package_name }}
          retention-days: 7

  # ----------------------------------------------------------------------------
  # JOB 3: SSH Deploy to Server with Atomic Swap, Health Check & Auto Rollback
  # ----------------------------------------------------------------------------
  deploy:
    name: 🚀 SSH Deploy & Health Check
    needs: build
    if: |
      ((github.event_name == 'push' && github.ref == 'refs/heads/dev') || github.event_name == 'workflow_dispatch') &&
      (github.event.inputs.deploy_to_server != 'false')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (để lấy deploy scripts & nginx config)
        uses: actions/checkout@v4

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist-${{ needs.build.outputs.short_sha }}
          path: .

      - name: Package Deploy Assets into Single Archive
        run: |
          # Đóng gói tất cả deploy assets vào 1 file tar duy nhất
          # để tránh vấn đề glob expansion trong appleboy/scp-action
          tar -czf deploy-assets.tar.gz deploy/
          echo "▶ Nội dung deploy-assets.tar.gz:"
          tar -tzf deploy-assets.tar.gz

      - name: Transfer Build Archive & Deploy Assets to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER || 'root' }}
          key: ${{ secrets.SSH_PRIVATE_KEY || secrets.SSH_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          # Chỉ dùng tên file tường minh, KHÔNG dùng glob (*) vì drone-scp không expand glob
          source: "${{ needs.build.outputs.package_name }},deploy-assets.tar.gz"
          target: "/tmp/frontend-transfer-${{ needs.build.outputs.short_sha }}"
          overwrite: true

      - name: Execute Deployment & Automated Health Check on Server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER || 'root' }}
          key: ${{ secrets.SSH_PRIVATE_KEY || secrets.SSH_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            SHORT_SHA="${{ needs.build.outputs.short_sha }}"
            PKG_NAME="${{ needs.build.outputs.package_name }}"
            TRANSFER_DIR="/tmp/frontend-transfer-${SHORT_SHA}"
            FRONTEND_DIR="/opt/ERP-UTT/frontend"

            echo "=========================================================="
            echo "  🚀 FRONTEND SSH DEPLOY TRIGGERED FROM GITHUB ACTIONS"
            echo "  Target Commit : ${SHORT_SHA}"
            echo "  Transfer Dir  : ${TRANSFER_DIR}"
            echo "  Target Dir    : ${FRONTEND_DIR}"
            echo "  SSH User      : $(whoami)"
            echo "  Timestamp     : $(date '+%Y-%m-%d %H:%M:%S')"
            echo "=========================================================="

            # Đảm bảo cấu trúc thư mục chính tồn tại trên server
            mkdir -p "${FRONTEND_DIR}/browser" 2>/dev/null || sudo -n mkdir -p "${FRONTEND_DIR}/browser"
            mkdir -p "${FRONTEND_DIR}/backups" 2>/dev/null || sudo -n mkdir -p "${FRONTEND_DIR}/backups"
            mkdir -p "${FRONTEND_DIR}/staging" 2>/dev/null || sudo -n mkdir -p "${FRONTEND_DIR}/staging"
            mkdir -p "${FRONTEND_DIR}/deploy/nginx" 2>/dev/null || sudo -n mkdir -p "${FRONTEND_DIR}/deploy/nginx"
            mkdir -p "${FRONTEND_DIR}/deploy/scripts" 2>/dev/null || sudo -n mkdir -p "${FRONTEND_DIR}/deploy/scripts"

            # Giải nén deploy-assets.tar.gz để lấy script và nginx config
            if [ -f "${TRANSFER_DIR}/deploy-assets.tar.gz" ]; then
              tar -xzf "${TRANSFER_DIR}/deploy-assets.tar.gz" -C "${TRANSFER_DIR}"
              rm -f "${TRANSFER_DIR}/deploy-assets.tar.gz"
              echo "  ✅ Đã giải nén deploy-assets.tar.gz"
            fi

            # Đồng bộ deploy scripts và nginx config vào thư mục chuẩn
            if [ -d "${TRANSFER_DIR}/deploy" ]; then
              cp -r "${TRANSFER_DIR}/deploy/nginx/"* "${FRONTEND_DIR}/deploy/nginx/" 2>/dev/null || sudo -n cp -r "${TRANSFER_DIR}/deploy/nginx/"* "${FRONTEND_DIR}/deploy/nginx/" 2>/dev/null || true
              cp -r "${TRANSFER_DIR}/deploy/scripts/"* "${FRONTEND_DIR}/deploy/scripts/" 2>/dev/null || sudo -n cp -r "${TRANSFER_DIR}/deploy/scripts/"* "${FRONTEND_DIR}/deploy/scripts/" 2>/dev/null || true
              chmod +x "${FRONTEND_DIR}/deploy/scripts/"*.sh 2>/dev/null || sudo -n chmod +x "${FRONTEND_DIR}/deploy/scripts/"*.sh 2>/dev/null || true
              echo "  ✅ Đã đồng bộ scripts và nginx config"
            fi

            # Di chuyển gói build vào thư mục frontend
            mv "${TRANSFER_DIR}/${PKG_NAME}" "${FRONTEND_DIR}/${PKG_NAME}" 2>/dev/null || sudo -n mv "${TRANSFER_DIR}/${PKG_NAME}" "${FRONTEND_DIR}/${PKG_NAME}"
            rm -rf "${TRANSFER_DIR}"

            # Gọi unified deploy script trên server
            bash "${FRONTEND_DIR}/deploy/scripts/deploy.sh" "${PKG_NAME}" "${SHORT_SHA}"

  # ----------------------------------------------------------------------------
  # JOB 4: Gửi thông báo kết quả CI/CD lên Discord
  # ----------------------------------------------------------------------------
  notify:
    name: 📢 Discord Notification
    needs: [validate, build, deploy]
    if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord Notification
        if: env.DISCORD_WEBHOOK != ''
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          VALIDATE_RES: ${{ needs.validate.result }}
          BUILD_RES: ${{ needs.build.result }}
          DEPLOY_RES: ${{ needs.deploy.result }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message || 'Manual trigger / Workflow Dispatch' }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          REPO: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          SHORT_SHA: ${{ needs.build.outputs.short_sha }}
        run: |
          python3 - << 'EOF'
          import os, json, urllib.request, datetime

          webhook_url = os.environ.get("DISCORD_WEBHOOK", "").strip()
          if not webhook_url:
              print("No DISCORD_WEBHOOK secret configured. Skipping Discord notification.")
              exit(0)

          val_res = os.environ.get("VALIDATE_RES", "skipped")
          build_res = os.environ.get("BUILD_RES", "skipped")
          deploy_res = os.environ.get("DEPLOY_RES", "skipped")

          is_success = (val_res == "success" and build_res == "success" and (deploy_res == "success" or deploy_res == "skipped"))
          color = 3066993 if is_success else 15158332 # Green or Red

          status_icon = {
              "success": "✅ Success",
              "failure": "❌ Failed",
              "cancelled": "⚠️ Cancelled",
              "skipped": "⚪ Skipped"
          }

          title = "🎨 [ERP Frontend] CI/CD Deploy THÀNH CÔNG!" if is_success else "❌ [ERP Frontend] CI/CD THẤT BẠI!"
          run_url = f"{os.environ.get('SERVER_URL')}/{os.environ.get('REPO')}/actions/runs/{os.environ.get('RUN_ID')}"
          short_sha = os.environ.get("SHORT_SHA") or os.environ.get("COMMIT_SHA", "")[:7]
          commit_msg = os.environ.get("COMMIT_MSG", "").split('\n')[0][:120]

          fields = [
              {"name": "🌿 Branch", "value": f"`{os.environ.get('BRANCH')}`", "inline": True},
              {"name": "👤 Người thực hiện", "value": f"@{os.environ.get('ACTOR')}", "inline": True},
              {"name": "🔖 Commit", "value": f"[`{short_sha}`]({os.environ.get('SERVER_URL')}/{os.environ.get('REPO')}/commit/{os.environ.get('COMMIT_SHA')}): {commit_msg}", "inline": False},
              {
                  "name": "📋 Trạng thái các bước",
                  "value": (
                      f"• **1. Fast Validation**: {status_icon.get(val_res, val_res)}\n"
                      f"• **2. Angular Build & Package**: {status_icon.get(build_res, build_res)}\n"
                      f"• **3. SSH Deploy & Health Check**: {status_icon.get(deploy_res, deploy_res)}"
                  ),
                  "inline": False
              },
              {"name": "🖥️ Server", "value": "`163.61.72.183`", "inline": True},
              {"name": "🌐 Website", "value": "[http://163.61.72.183](http://163.61.72.183/)", "inline": True}
          ]

          payload = {
              "username": "ERP GitHub Actions Bot",
              "avatar_url": "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png",
              "embeds": [
                  {
                      "title": title,
                      "url": run_url,
                      "color": color,
                      "description": f"Workflow run: [#{os.environ.get('RUN_NUMBER')}]({run_url})",
                      "fields": fields,
                      "footer": {"text": "ERP UTT CI/CD System • Frontend Angular 21"},
                      "timestamp": datetime.datetime.now(datetime.timezone.utc).isoformat()
                  }
              ]
          }

          req = urllib.request.Request(
              webhook_url,
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": "GitHubActions-Discord-Notifier"
              }
          )

          try:
              with urllib.request.urlopen(req) as resp:
                  print(f"Discord notification sent successfully! HTTP Status: {resp.status}")
          except Exception as e:
              print(f"Failed to send Discord notification: {e}")
          EOF
