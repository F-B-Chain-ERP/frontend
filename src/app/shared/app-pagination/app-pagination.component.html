<div class="apg">
  <div class="apg__info">
    <span class="apg__total">
      Tổng <strong>{{ total }}</strong> bản ghi
    </span>
    @if (total > 0) {
      <span class="apg__divider"></span>
      <span class="apg__range">
        Hiển thị <strong>{{ rangeFrom }}–{{ rangeTo }}</strong>
      </span>
    }
  </div>

  <div class="apg__controls">
    <nz-select
      class="apg__size-select"
      [ngModel]="pageSize"
      (ngModelChange)="onPageSizeChange($event)"
    >
      @for (opt of pageSizeOptions; track opt) {
        <nz-option [nzValue]="opt" [nzLabel]="opt + ' / trang'" />
      }
    </nz-select>

    <nz-pagination
      [nzPageIndex]="pageIndex"
      (nzPageIndexChange)="onPageIndexChange($event)"
      [nzPageSize]="pageSize"
      [nzTotal]="total"
    />
  </div>
</div>
