<div class="error-page" style="padding: 48px; text-align: center;">
  @if (errorMessage()) {
    <h1 style="font-size: 28px; font-weight: 700; margin-bottom: 16px;">Có lỗi xảy ra</h1>
    <p style="color: var(--text-secondary); font-size: 16px;">{{ errorMessage() }}</p>
  } @else {
    <h1 style="font-size: 48px; font-weight: 800; color: var(--brand); margin-bottom: 16px;">404</h1>
    <h2 style="font-size: 20px; font-weight: 600; margin-bottom: 8px;">Không tìm thấy trang</h2>
    <p style="color: var(--text-secondary); font-size: 14px;">Trang bạn yêu cầu không tồn tại hoặc đã bị di chuyển.</p>
  }
</div>
