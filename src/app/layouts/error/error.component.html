<div [class.error-container]="!isCardOnly">
  <div class="error-card">
    <div class="error-illustration">
      <div class="error-badge-halo error-badge-halo--{{ errorCode() }}">
        @if (errorCode() === '404') {
          <nz-icon nzType="compass"/>
        } @else if (errorCode() === '403') {
          <nz-icon nzType="lock"/>
        } @else {
          <nz-icon nzType="warning"/>
        }
      </div>
    </div>

    <div class="error-code error-code--{{ errorCode() }}">
      {{ errorCode() }}
    </div>

    <h1 class="error-title">{{ errorTitle() }}</h1>

    <p class="error-description">
      {{ errorDescription() }}
    </p>

    <div class="error-actions">
      <app-button variant="secondary" leftIcon="arrow-left" (click)="goBack()">
        Quay lại
      </app-button>
      <app-button variant="primary" leftIcon="home" (click)="goHome()">
        Về trang chủ
      </app-button>
    </div>
  </div>
</div>
