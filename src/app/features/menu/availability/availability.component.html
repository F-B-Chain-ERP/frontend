<div class="availability-page">
  <!-- ════════════════════════════════════════════════════════════
       SECTION 1: PAGE HEADER
       ════════════════════════════════════════════════════════════ -->
  <div class="page__header">
    <div class="page__header__left">
      <h1 class="page__header__title">Khả dụng Chi nhánh</h1>
      <app-breadcrumbs></app-breadcrumbs>
    </div>
  </div>

  <!-- ════════════════════════════════════════════════════════════
       SECTION 2: TABS + FILTER + TABLE
       ════════════════════════════════════════════════════════════ -->
  <nz-tabs
    [nzSelectedIndex]="activeTab() === 'product' ? 0 : 1"
    (nzSelectedIndexChange)="onTabChange($event)"
    class="availability-tabs">

    <!-- ════════════════════════════════════════════════════════════ -->
    <!-- TAB 1: SẢN PHẨM KHẢ DỤNG -->
    <!-- ════════════════════════════════════════════════════════════ -->
    <nz-tab nzTitle="Sản phẩm khả dụng">
      <div class="availability-filter">
        <label class="form-label">Chi nhánh</label>
        <nz-select
          [(ngModel)]="selectedBranchId"
          (ngModelChange)="onBranchChange($event)"
          nzPlaceHolder="Chọn chi nhánh"
          class="availability-filter__select">
          @for (b of branchService.branches(); track b.id) {
            <nz-option [nzLabel]="b.name" [nzValue]="b.id"></nz-option>
          }
        </nz-select>
      </div>

      <!-- Table -->
      @if (selectedBranchId(); as branchId) {
        <app-availability-table type="product" [branchId]="branchId" />
      }
    </nz-tab>

    <!-- ════════════════════════════════════════════════════════════ -->
    <!-- TAB 2: TOPPING KHẢ DỤNG -->
    <!-- ════════════════════════════════════════════════════════════ -->
    <nz-tab nzTitle="Topping khả dụng">
      <div class="availability-filter">
        <label class="form-label">Chi nhánh</label>
        <nz-select
          [(ngModel)]="selectedBranchId"
          (ngModelChange)="onBranchChange($event)"
          nzPlaceHolder="Chọn chi nhánh"
          class="availability-filter__select">
          @for (b of branchService.branches(); track b.id) {
            <nz-option [nzLabel]="b.name" [nzValue]="b.id"></nz-option>
          }
        </nz-select>
      </div>

      <!-- Table -->
      @if (selectedBranchId(); as branchId) {
        <app-availability-table type="topping" [branchId]="branchId" />
      }
    </nz-tab>
  </nz-tabs>
</div>
