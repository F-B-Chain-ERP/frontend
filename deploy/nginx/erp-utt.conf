# ==============================================================================
# Cấu hình Nginx Production cho ERP-UTT (Angular 21 SPA & Backend Reverse Proxy)
# Hỗ trợ: HTTPS/TLS 1.3, Let's Encrypt SSL, Tự động Redirect HTTP -> HTTPS, HSTS
# Domain: erp-utt.duckdns.org
# File đích trên Server: /etc/nginx/sites-available/erp-utt
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. HTTP Server (Port 80): ACME Challenge & Redirect 301 sang HTTPS
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name erp-utt.duckdns.org 163.61.72.183 vm08181524.bnixvps.io.vn localhost;

    # Cho phép Certbot xác thực chứng chỉ Let's Encrypt (ACME Challenge)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Chuyển hướng toàn bộ lưu lượng HTTP sang HTTPS với domain chính thức
    location / {
        return 301 https://erp-utt.duckdns.org$request_uri;
    }
}

# ------------------------------------------------------------------------------
# 2. HTTPS Server (Port 443): SSL/TLS Termination & Ứng dụng chính
# ------------------------------------------------------------------------------
server {
    # Lắng nghe trực tiếp trên cổng 443 tiêu chuẩn cho HTTPS
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name erp-utt.duckdns.org;

    # Thư mục chứa mã nguồn tĩnh Angular sau khi build
    root /opt/ERP-UTT/frontend/browser;
    index index.html;

    # Kích thước tối đa của request body (upload file ảnh/tài liệu)
    client_max_body_size 50M;

    # --------------------------------------------------------------------------
    # Cấu hình SSL Let's Encrypt
    # --------------------------------------------------------------------------
    ssl_certificate /etc/letsencrypt/live/erp-utt.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/erp-utt.duckdns.org/privkey.pem;

    # Giao thức TLS bảo mật (chỉ cho phép TLS 1.2 và TLS 1.3)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # Tối ưu hóa hiệu năng bắt tay SSL (Session cache & timeout)
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # OCSP Stapling (Tăng tốc độ kiểm tra chứng chỉ cho trình duyệt)
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 1.1.1.1 valid=300s;
    resolver_timeout 5s;

    # --------------------------------------------------------------------------
    # Production Security Headers
    # --------------------------------------------------------------------------
    # HSTS: Buộc trình duyệt luôn kết nối qua HTTPS trong 1 năm
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # --------------------------------------------------------------------------
    # Tối ưu Gzip Compression (Giảm 60-80% dung lượng JS/CSS tải về)
    # --------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml
        font/woff
        font/woff2;

    # --------------------------------------------------------------------------
    # Caching cho Static Assets Hashed Chunks (JS, CSS, Images, Fonts)
    # --------------------------------------------------------------------------
    location ~* \.(?:ico|css|js|gif|jpe?g|png|svg|woff2?|eot|ttf|otf|webp)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # --------------------------------------------------------------------------
    # Reverse Proxy sang Backend Service (Spring Boot :8080 nội bộ)
    # --------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Timeout cấu hình cho tác vụ tải file / xử lý dữ liệu dài
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffering tối ưu
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # --------------------------------------------------------------------------
    # Actuator Health / Metrics (Chỉ cho phép nội bộ VPS truy cập)
    # --------------------------------------------------------------------------
    location /actuator/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        
        allow 127.0.0.1;
        deny all;
    }

    # --------------------------------------------------------------------------
    # Reverse Proxy cho MinIO S3 API (Truy cập ảnh sản phẩm trực tiếp qua HTTPS)
    # --------------------------------------------------------------------------
    location /storage/ {
        rewrite ^/storage/(.*) /$1 break;
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_buffering off;
        proxy_request_buffering off;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }


    # --------------------------------------------------------------------------
    # File index.html: KHÔNG cache để người dùng luôn nhận bản build mới nhất
    # --------------------------------------------------------------------------
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        
        # Security headers lặp lại cho location block
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # --------------------------------------------------------------------------
    # Angular SPA Routing Fallback
    # --------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
        
        # Security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Trang lỗi tùy biến
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

# ------------------------------------------------------------------------------
# 3. MinIO Web Console HTTPS Server (Port 9001): SSL/TLS Termination cho Dev
# ------------------------------------------------------------------------------
server {
    listen 9001 ssl http2;
    listen [::]:9001 ssl http2;
    server_name erp-utt.duckdns.org 163.61.72.183;

    # Dùng chung chứng chỉ Let's Encrypt SSL của erp-utt.duckdns.org
    ssl_certificate /etc/letsencrypt/live/erp-utt.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/erp-utt.duckdns.org/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # Tự động redirect nếu browser gửi plain HTTP sang cổng SSL
    error_page 497 301 =307 https://$host:9001$request_uri;

    location / {
        proxy_pass http://127.0.0.1:9002;
        proxy_http_version 1.1;

        # WebSocket support (bắt buộc cho MinIO Web UI)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_buffering off;
        proxy_request_buffering off;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}
