# ==============================================================================
# Cấu hình Nginx cho ERP-UTT Frontend (Angular 21 SPA) & Reverse Proxy Backend
# File đích trên Server: /etc/nginx/sites-available/erp-utt
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name erp-utt.duckdns.org 163.61.72.183 vm08181524.bnixvps.io.vn localhost;

    # --------------------------------------------------------------------------
    # 0. Bắt buộc HTTPS cho OAuth2 (Google Sign-In không chấp nhận HTTP origin)
    #    Chạy: sudo certbot --nginx -d erp-utt.duckdns.org
    #    Sau đó Certbot tự thêm block listen 443 + chứng chỉ bên dưới.
    # --------------------------------------------------------------------------

    # Thư mục chứa mã nguồn tĩnh Angular sau khi build
    root /opt/ERP-UTT/frontend/browser;
    index index.html;

    # Kích thước tối đa của request body (upload file)
    client_max_body_size 50M;

    # --------------------------------------------------------------------------
    # 1. Tối ưu Gzip Compression (Giảm 60-80% dung lượng JS/CSS tải về)
    # --------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml
        font/woff
        font/woff2;

    # --------------------------------------------------------------------------
    # 2. Caching cho Static Assets Hashed Chunks (JS, CSS, Images, Fonts)
    # Angular có output hashing (e.g., chunk-XYZ.js) nên cache 1 năm tuyệt đối an toàn
    # --------------------------------------------------------------------------
    location ~* \.(?:ico|css|js|gif|jpe?g|png|svg|woff2?|eot|ttf|otf|webp)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # --------------------------------------------------------------------------
    # 3. Reverse Proxy sang Backend Service (Spring Boot :8080)
    # --------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout cấu hình cho tác vụ tải file / xử lý dữ liệu dài
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffering tối ưu
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # --------------------------------------------------------------------------
    # 4. Actuator Health / Metrics (Chỉ cho phép truy cập nội bộ)
    # --------------------------------------------------------------------------
    location /actuator/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        
        allow 127.0.0.1;
        deny all;
    }

    # --------------------------------------------------------------------------
    # 5. File index.html: KHÔNG cache để người dùng luôn nhận bản build mới nhất
    # --------------------------------------------------------------------------
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        
        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # --------------------------------------------------------------------------
    # 6. Angular SPA Routing Fallback
    # Mọi đường dẫn (e.g., /home, /login, /users) điều hướng về index.html
    # --------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
        
        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Trang lỗi tùy biến
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
